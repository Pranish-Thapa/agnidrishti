<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      GitHub Pages serves this file for unknown paths. The app is a client-side
      React SPA, so send visitors back to the application root instead of
      rendering a stale asset manifest. <base> keeps every relative URL
      anchored to the project site even when the path is several segments deep.
    -->
    <base href="/agnidrishti/" />
    <title>Agnidrishti — See the fire. Verify the signal.</title>
    <meta name="description" content="Agnidrishti is a satellite-aware fire activity calendar that separates real fire trends from changes in satellite observation." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta http-equiv="refresh" content="0; url=./" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a1211;
        color: #e8e4da;
        font: 16px/1.6 "IBM Plex Sans", system-ui, sans-serif;
        text-align: center;
        padding: 2rem;
      }
      a { color: #f0a868; }
    </style>
  </head>
  <body>
    <div>
      <p>That route does not exist.</p>
      <p><a href="./">Go to Agnidrishti</a>.</p>
    </div>
    <script>
      // Redirect after the fallback link, so the target does not depend on the meta tag alone.
      if (!window.location.pathname.replace(/\/+$/, "").endsWith("/agnidrishti")) {
        window.location.replace("./");
      }
    </script>
  </body>
</html>
